apiVersion: 1

datasources:
  - name: Prometheus
    uid: ed-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Tempo
    uid: ed-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: ed-prometheus
      nodeGraph:
        enabled: true
