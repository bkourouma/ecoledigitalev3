services:
  ecoledigitale-api:
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.api
    image: ecoledigitale-api:latest
    container_name: ecoledigitale-api
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8011
    ports:
      - "127.0.0.1:8011:8011"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8011/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ecoledigitale-web:
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.web
    image: ecoledigitale-web:latest
    container_name: ecoledigitale-web
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://ecoledigitale-api:8011
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    depends_on:
      - ecoledigitale-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: ecoledigitale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbecoledigitale}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ecoledigitale-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ecoledigitale-postgres-data
  minio_data:
    name: ecoledigitale-minio-data

networks:
  ecoledigitale-network:
    name: ecoledigitale-network
    driver: bridge
