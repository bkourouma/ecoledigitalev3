services:
  ecoledigitale-api:
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.api
    image: ecoledigitale-api:latest
    container_name: ecoledigitale-api
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8011
      # Surcharge la valeur du .env (redis://localhost:6379, valable en
      # developpement local) : dans le reseau compose, Redis est joignable
      # par le nom de service.
      REDIS_URL: redis://redis:6379
      # Repertoire des fichiers deposes (apps/api/src/services/fileStorage.ts
      # lit FILE_STORAGE_PATH, avec `<cwd>/uploads` par defaut ; le cwd du
      # conteneur est /app/apps/api). Monte sur le volume nomme ci-dessous pour
      # survivre aux rebuilds de l'image.
      FILE_STORAGE_PATH: /app/apps/api/uploads
    volumes:
      - api_uploads:/app/apps/api/uploads
    ports:
      - "127.0.0.1:8011:8011"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8011/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Worker v2 (apps/worker) : relais d'outbox -> BullMQ, abonnes d'evenements, jobs planifies.
  # Profil "worker" : il n est ni construit ni demarre par un `docker compose up` ordinaire
  # (la base v2 : schema kernel, role app_user, migrations du worker, doit exister d abord).
  #   docker compose -f infra/compose/docker-compose.yml --profile worker up -d --build ecoledigitale-worker
  # Une fois la base v2 en production, retirer la ligne `profiles` pour l inclure d office.
  #
  # Volontairement SANS env_file : il ne recoit ni DATABASE_URL (role privilegie de l ancienne
  # API) ni aucun autre secret. Le worker refuse de demarrer si son role est superuser ou
  # BYPASSRLS. WORKER_DATABASE_URL (role de connexion membre de app_user) vient du .env du
  # projet compose ou de l environnement ; rien n est ecrit en dur ici.
  ecoledigitale-worker:
    profiles: ["worker"]
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.worker
    image: ecoledigitale-worker:latest
    container_name: ecoledigitale-worker
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      WORKER_HTTP_HOST: 0.0.0.0
      WORKER_HTTP_PORT: 8012
      WORKER_QUEUE_PREFIX: ${WORKER_QUEUE_PREFIX:-ed}
    restart: unless-stopped
    # Arret gracieux : WORKER_SHUTDOWN_TIMEOUT_MS (25 s) + marge avant le SIGKILL de Docker.
    stop_grace_period: 40s
    networks:
      - ecoledigitale-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8012/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ecoledigitale-web:
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.web
    image: ecoledigitale-web:latest
    container_name: ecoledigitale-web
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://ecoledigitale-api:8011
      # auth-options.ts reads API_URL when building the next-auth credentials
      # POST URL — has to point at the API container too, not the web's own port.
      API_URL: http://ecoledigitale-api:8011
      # Server-side route handlers (e.g. /api/teacher/current) read
      # NEXT_PUBLIC_API_URL to know where to proxy. Set at RUNTIME only —
      # not as a build arg — so the client bundle still uses relative URLs
      # (which the browser sends through nginx → /api/v1/ → API).
      NEXT_PUBLIC_API_URL: http://ecoledigitale-api:8011
      # Panneau « Comptes par tenant » de /login : il remplit le formulaire avec
      # les identifiants des comptes techniques. DÉSACTIVÉ par défaut (SEC-02) ; une instance de
      # démonstration avec des données de test doit l'activer explicitement. Ne jamais l'activer si elle accueille de
      # vraies données (SHOW_TECHNICAL_ACCOUNTS=true) —
      # sans quoi n'importe quel visiteur ouvre la session administrateur.
      SHOW_TECHNICAL_ACCOUNTS: ${SHOW_TECHNICAL_ACCOUNTS:-false}
    ports:
      - "127.0.0.1:3011:3000"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    depends_on:
      - ecoledigitale-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: ecoledigitale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbecoledigitale}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis : files BullMQ (worker), limitation de debit, cache. Aucun port publie :
  # seuls les conteneurs du reseau ecoledigitale-network y accedent (redis://redis:6379).
  # Pas de mot de passe tant que le port n'est pas expose ; en ajouter un
  # (--requirepass + REDIS_URL) si Redis sort un jour de ce reseau.
  redis:
    image: redis:7-alpine
    container_name: ecoledigitale-redis
    # AOF : les jobs en file survivent a un redemarrage du conteneur.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: ecoledigitale-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - ecoledigitale-network
    healthcheck:
      # `mc ready local` est fourni par l'image ; curl a disparu des images
      # MinIO recentes, d'ou le repli.
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    name: ecoledigitale-postgres-data
  minio_data:
    name: ecoledigitale-minio-data
  redis_data:
    name: ecoledigitale-redis-data
  api_uploads:
    name: ecoledigitale-api-uploads

networks:
  ecoledigitale-network:
    name: ecoledigitale-network
    driver: bridge
