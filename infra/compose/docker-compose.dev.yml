# Services d'infrastructure pour le developpement local : Postgres + Redis + MinIO.
# L'API et le web tournent hors Docker (`pnpm dev`) et se connectent a ces
# services via localhost. Ce fichier est independant de docker-compose.yml
# (production / staging) : autre nom de projet, autres volumes, aucun conflit.
#
# Usage (depuis la racine du depot) :
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#   docker compose -f infra/compose/docker-compose.dev.yml down      # garde les donnees
#   docker compose -f infra/compose/docker-compose.dev.yml down -v   # efface les donnees
#
# Valeurs correspondantes du .env de l'API :
#   DATABASE_URL=postgresql://postgres:<mot-de-passe>@localhost:5432/dbecoledigitale
#   REDIS_URL=redis://localhost:6379
#   MINIO_ENDPOINT=localhost:9000   MINIO_USER/MINIO_PASSWORD=minioadmin
# Tous les ports sont lies a 127.0.0.1 et surchargeables (POSTGRES_PORT,
# REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT) si un service local occupe deja le port.
name: ecoledigitale-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbecoledigitale}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Worker v2 en conteneur : PROFIL OPTIONNEL (non demarre par defaut). En developpement on lance
  # plutot `pnpm --filter @ecoledigitale/worker dev` hors Docker. Pour le conteneur :
  #   docker compose -f infra/compose/docker-compose.dev.yml --profile worker up -d --build worker
  # WORKER_DATABASE_URL : role de connexion membre de app_user (voir apps/worker/README.md),
  # fourni par l environnement ou le .env du projet compose ; aucun secret n est ecrit ici.
  worker:
    profiles: ["worker"]
    build:
      context: ../../
      dockerfile: infra/compose/Dockerfile.worker
    init: true
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-debug}
      REDIS_URL: redis://redis:6379
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      WORKER_HTTP_HOST: 0.0.0.0
      WORKER_HTTP_PORT: 8012
    ports:
      - "127.0.0.1:${WORKER_HTTP_PORT:-8012}:8012"
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
