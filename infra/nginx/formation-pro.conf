# Nginx vhost for formation-pro-public on alliance (srv917891)
# Domain: formation-pro.allianceconsultants.net
# Place at: /etc/nginx/sites-available/formation-pro
# Symlink:  /etc/nginx/sites-enabled/formation-pro
# TLS via certbot --nginx (issues + auto-renews Let's Encrypt cert)

server {
    listen 80;
    listen [::]:80;
    server_name formation-pro.allianceconsultants.net;

    # ACME http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name formation-pro.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/formation-pro.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formation-pro.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js app on 127.0.0.1:3012 (formation-pro container)
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
