# Nginx vhost for EcoleDigitale staging
# Domain: staging-ecoledigitale.allianceconsultants.net
# Place at: /etc/nginx/sites-available/ecoledigitale-staging
# Symlink:  /etc/nginx/sites-enabled/ecoledigitale-staging
# TLS via certbot --nginx

server {
    listen 80;
    listen [::]:80;
    server_name staging-ecoledigitale.allianceconsultants.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-ecoledigitale.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/staging-ecoledigitale.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecoledigitale.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header x-middleware-subrequest ""; # SEC-09 CVE-2025-29927 (Next < 15.2.3)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # D-5 : ne jamais relayer un X-Forwarded-For fourni par le client (API : TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8011/api/v1/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header x-middleware-subrequest ""; # SEC-09 CVE-2025-29927 (Next < 15.2.3)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # D-5 : ne jamais relayer un X-Forwarded-For fourni par le client (API : TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
