# Nginx vhost for EcoleDigitale on srv917891
# Domain: ecoledigitale.allianceconsultants.net (+ tenant wildcard)
# Place at: /etc/nginx/sites-available/ecoledigitale
# Symlink:  /etc/nginx/sites-enabled/ecoledigitale
# TLS via certbot --nginx (issues + auto-renews Let's Encrypt cert)

server {
    listen 80;
    listen [::]:80;
    server_name ecoledigitale.allianceconsultants.net *.ecoledigitale.allianceconsultants.net;

    # ACME http-01 challenge (certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecoledigitale.allianceconsultants.net *.ecoledigitale.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/ecoledigitale.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoledigitale.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    # Tenant from subdomain — passed to API via header
    set $tenant "";
    if ($host ~* "^([^.]+)\.ecoledigitale\.allianceconsultants\.net$") {
        set $tenant $1;
    }

    # Fastify API on 127.0.0.1:8011 — only the versioned routes.
    # /api/auth/* belongs to next-auth and stays on the Next.js container.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header x-middleware-subrequest ""; # SEC-09 CVE-2025-29927 (Next < 15.2.3)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant $tenant;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Health endpoint (no access log)
    location = /health {
        proxy_pass http://127.0.0.1:8011/api/v1/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js app on 127.0.0.1:3000
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header x-middleware-subrequest ""; # SEC-09 CVE-2025-29927 (Next < 15.2.3)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
