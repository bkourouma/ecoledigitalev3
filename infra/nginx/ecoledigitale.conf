# Nginx configuration for EcoleDigitale on shared VPS
# ⚠️ CRITICAL: This is for the shared VPS with existing applications
# Domain: ecoledigitale.engage-360.net
# Port: 8011 (dedicated for EcoleDigitale)

server {
    listen 80;
    server_name ecoledigitale.engage-360.net *.ecoledigitale.engage-360.net;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecoledigitale.engage-360.net *.ecoledigitale.engage-360.net;

    # SSL Configuration (adjust paths according to VPS setup)
    ssl_certificate /path/to/ssl/ecoledigitale.engage-360.net.crt;
    ssl_certificate_key /path/to/ssl/ecoledigitale.engage-360.net.key;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API routes - proxy to Fastify backend on port 8011
    location /api/ {
        proxy_pass http://localhost:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass tenant from subdomain
        set $tenant "";
        if ($host ~* "^([^.]+)\.ecoledigitale\.engage-360\.net$") {
            set $tenant $1;
        }
        proxy_set_header X-Tenant $tenant;
        
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Frontend routes - proxy to Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # Next.js specific
        proxy_buffering off;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other static files
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8011/api/v1/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}











