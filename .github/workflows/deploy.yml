# Deploiement uniquement. La CI (typecheck, lint, tests, build) est dans ci.yml.
name: Deploy to alliance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alliance-ecoledigitale
  # `true` : un nouveau push annule le run precedent encore en attente ou en
  # cours. Avec `false`, un seul run bloque gelait indefiniment tous les
  # suivants — vecu le 19/08 : le runner de staging etant hors ligne, le run #64
  # restait « Queued » sans fin et les runs #65 et #66 affichaient « waiting for
  # #64 to complete », la production n'etant jamais deployee.
  #
  # Le risque associe — interrompre un deploiement en cours — est limite ici :
  # deploy.sh est idempotent, et le run suivant reprend depuis le debut. Seule
  # la derniere version poussee compte.
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: [self-hosted, alliance-ecoledigitale-staging]
    timeout-minutes: 60
    environment:
      name: staging
      url: https://staging-ecoledigitale.allianceconsultants.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "commit: $GITHUB_SHA"
          echo "ref:    $GITHUB_REF"
          docker --version
          docker compose version

      - name: Make scripts executable
        run: chmod +x infra/scripts/deploy.sh infra/scripts/restore-db-on-server.sh

      - name: Deploy staging
        env:
          ENV_FILE: /home/deployer/ecoledigitale-staging.env
          COMPOSE_PROJECT: ecoledigitale-staging
          DEPLOY_HEALTH_URL: https://staging-ecoledigitale.allianceconsultants.net/health
        run: ./infra/scripts/deploy.sh

  deploy-production:
    # `needs: deploy-staging` retire temporairement : le runner de staging est
    # hors ligne, ses jobs restent en « Queued » et la production n'etait donc
    # jamais deployee. Les deux jobs sont desormais independants.
    # A RETABLIR une fois le runner alliance-ecoledigitale-staging reconnecte,
    # pour retrouver la validation sur staging avant la production.
    runs-on: [self-hosted, alliance-ecoledigitale]
    timeout-minutes: 60
    environment:
      name: production
      url: https://ecoledigitale.allianceconsultants.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "commit: $GITHUB_SHA"
          echo "ref:    $GITHUB_REF"
          docker --version
          docker compose version

      - name: Make scripts executable
        run: chmod +x infra/scripts/deploy.sh infra/scripts/restore-db-on-server.sh

      - name: Deploy production
        env:
          ENV_FILE: /home/deployer/ecoledigitale.env
          COMPOSE_PROJECT: ecoledigitale
          DEPLOY_HEALTH_URL: https://ecoledigitale.allianceconsultants.net/health
        run: ./infra/scripts/deploy.sh
